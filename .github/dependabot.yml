version: 2
updates:
  # Backend dependencies — check weekly
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    ignore:
      # Only auto-update patch versions for major packages — review minors manually
      - dependency-name: express
        update-types: ['version-update:semver-major']
      - dependency-name: mongoose
        update-types: ['version-update:semver-major']
      - dependency-name: socket.io
        update-types: ['version-update:semver-major']

  # Frontend dependencies — check weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend

  # GitHub Actions themselves — keep the action versions current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
    labels:
      - dependencies
      - ci
