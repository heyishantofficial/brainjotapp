version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: brainjot-mongodb
    # Port 27017 intentionally not exposed to host — only accessible within Docker network
    volumes:
      - brainjot-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./backend
    container_name: brainjot-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/brainjot
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/usr/src/app/uploads

  frontend:
    build: ./frontend
    container_name: brainjot-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  brainjot-data:
